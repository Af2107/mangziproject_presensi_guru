<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Guru & Admin Profesional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @media print {
            body * {
                visibility: hidden;
            }
            #attendanceTableExport, #attendanceTableExport * {
                visibility: visible;
            }
            #attendanceTableExport {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <!-- Global Loading Overlay -->
    <div id="globalLoader" class="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-[9999] hidden flex items-center justify-center">
        <div class="bg-white p-5 rounded-2xl shadow-2xl flex items-center space-x-3">
            <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
            <span class="text-xs font-bold text-slate-700" id="loaderText">Menyinkronkan data ke Cloud...</span>
        </div>
    </div>

    <!-- Notification Toast Modal -->
    <div id="notificationToast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 max-w-sm w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-4 flex items-start space-x-3 pointer-events-none">
        <div id="toastIcon" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"></div>
        <div class="flex-1">
            <h4 id="toastTitle" class="text-sm font-bold text-slate-800"></h4>
            <p id="toastMessage" class="text-xs text-slate-500 mt-0.5"></p>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbykzsTtwz-61QAPTSKOjwnxtVoLc32Uwg_egBeZAC6Ui2ITkpaIF0NoXNc6sC2Z5vbPeA/exec';

        const STORAGE_KEY_TEACHERS = 'siskolah_teachers_v2';
        const STORAGE_KEY_SETTINGS = 'siskolah_settings_v2';

        const defaultSettings = {
            schoolName: 'SMA Negeri 1 Nusantara',
            academicYear: '2025/2026',
            maxCheckInTime: '07:30'
        };

        const defaultTeachers = [
            { id: 'T001', name: 'Dra. Hj. Siti Aminah, M.Pd', nip: '197005121994032001', subject: 'Matematika', pin: '1234', barcode: 'BC-T001' },
            { id: 'T002', name: 'Budi Santoso, S.Pd', nip: '198208152009021003', subject: 'Fisika', pin: '1234', barcode: 'BC-T002' },
            { id: 'T003', name: 'Dewi Lestari, S.Si', nip: '198803222014032005', subject: 'Kimia', pin: '1234', barcode: 'BC-T003' },
            { id: 'T004', name: 'Ahmad Fauzi, M.Kom', nip: '199012012019031002', subject: 'Informatika', pin: '1234', barcode: 'BC-T004' }
        ];

        // Global Application State & Cloud Cache
        let attendanceCache = [];
        let appState = {
            view: 'landing', 
            currentTeacher: null,
            adminActiveTab: 'dashboard',
            selectedMonth: new Date().toISOString().slice(0, 7)
        };

        function showLoader(text = 'Menyinkronkan data...') {
            document.getElementById('loaderText').textContent = text;
            document.getElementById('globalLoader').classList.remove('hidden');
        }

        function hideLoader() {
            document.getElementById('globalLoader').classList.add('hidden');
        }

        function getSettings() {
            const data = localStorage.getItem(STORAGE_KEY_SETTINGS);
            return data ? JSON.parse(data) : defaultSettings;
        }

        function saveSettings(settings) {
            localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
        }

        function getTeachers() {
            const data = localStorage.getItem(STORAGE_KEY_TEACHERS);
            if (!data) {
                localStorage.setItem(STORAGE_KEY_TEACHERS, JSON.stringify(defaultTeachers));
                return defaultTeachers;
            }
            return JSON.parse(data);
        }

        function saveTeachers(teachers) {
            localStorage.setItem(STORAGE_KEY_TEACHERS, JSON.stringify(teachers));
        }

        // Fetch attendance from Google Sheets
        async function fetchAttendanceFromCloud() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const result = await response.json();
                if (result.status === 'success') {
                    attendanceCache = result.data || [];
                }
            } catch (err) {
                console.error("Gagal mengambil data dari Google Sheets:", err);
            }
        }

        // Save attendance to Google Sheets
        async function saveAttendanceToCloud(record) {
            showLoader('Mengirim data absensi ke Cloud...');
            try {
                const payload = {
                    action: 'save',
                    ...record
                };
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                // Optimistically push to local cache & refetch
                attendanceCache.unshift(record);
                await fetchAttendanceFromCloud();
            } catch (err) {
                console.error("Gagal menyimpan ke Google Sheets:", err);
                showNotification('Peringatan', 'Gagal menyinkronkan ke cloud, periksa koneksi internet.', 'error');
            } finally {
                hideLoader();
            }
        }

        function showNotification(title, message, type = 'success', callback = null) {
            const toast = document.getElementById('notificationToast');
            const toastIcon = document.getElementById('toastIcon');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');

            toastTitle.textContent = title;
            toastMessage.textContent = message;

            if (type === 'success') {
                toastIcon.className = 'w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0';
                toastIcon.innerHTML = '<i class="fa-solid fa-check text-lg"></i>';
            } else {
                toastIcon.className = 'w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center shrink-0';
                toastIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-lg"></i>';
            }

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
                if (callback) callback();
            }, 2500);
        }

        async function initApp() {
            showLoader('Memuat data dari Google Sheets...');
            await fetchAttendanceFromCloud();
            hideLoader();
            render();
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (appState.view === 'landing') {
                app.innerHTML = renderLandingView();
            } else if (appState.view === 'teacher_login') {
                app.innerHTML = renderTeacherLoginView();
            } else if (appState.view === 'teacher_dashboard') {
                app.innerHTML = renderTeacherDashboardView();
            } else if (appState.view === 'admin_login') {
                app.innerHTML = renderAdminLoginView();
            } else if (appState.view === 'admin_dashboard') {
                app.innerHTML = renderAdminDashboardView();
            }

            attachEventHandlers();
        }

        function renderLandingView() {
            const settings = getSettings();
            return `
            <div class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white flex flex-col justify-between p-6 sm:p-12 relative overflow-hidden">
                <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

                <header class="max-w-5xl mx-auto w-full flex justify-between items-center z-10">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                            <i class="fa-solid fa-fingerprint text-white text-xl"></i>
                        </div>
                        <div>
                            <span class="text-xs uppercase tracking-wider text-indigo-400 font-semibold block">Sistem Absensi Online</span>
                            <h2 class="text-sm font-bold">${settings.schoolName}</h2>
                        </div>
                    </div>
                    <button onclick="appState.view='admin_login'; render();" class="text-xs bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl backdrop-blur transition border border-white/10 flex items-center space-x-2">
                        <i class="fa-solid fa-user-shield"></i>
                        <span>Login Admin</span>
                    </button>
                </header>

                <main class="max-w-4xl mx-auto w-full text-center py-12 z-10 space-y-8">
                    <div class="space-y-4">
                        <span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-4 py-1.5 rounded-full text-xs font-semibold inline-block">
                            Portal Absensi Terintegrasi Cloud & Sinkron Realtime
                        </span>
                        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-tight">
                            Absensi Guru Digital <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Face ID & Barcode</span>
                        </h1>
                        <p class="text-slate-300 text-sm sm:text-base max-w-xl mx-auto">
                            Sistem presensi modern berbasis cloud Google Sheets. Data dari HP dan Laptop akan langsung sinkron otomatis.
                        </p>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-center items-center gap-4 pt-4">
                        <button onclick="appState.view='teacher_login'; render();" class="w-full sm:w-auto bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold px-8 py-4 rounded-2xl shadow-xl shadow-indigo-600/30 transition transform hover:-translate-y-0.5 flex items-center justify-center space-x-3 text-base">
                            <i class="fa-solid fa-chalkboard-user text-xl"></i>
                            <span>Mulai Absensi Guru</span>
                        </button>
                        <button onclick="appState.view='admin_login'; render();" class="w-full sm:w-auto bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-semibold px-8 py-4 rounded-2xl border border-slate-700 transition flex items-center justify-center space-x-3 text-base">
                            <i class="fa-solid fa-lock text-lg"></i>
                            <span>Dashboard Administrator</span>
                        </button>
                    </div>
                </main>

                <footer class="text-center text-xs text-slate-500 z-10">
                    &copy; ${new Date().getFullYear()} ${settings.schoolName}. Hak Cipta Dilindungi.
                </footer>
            </div>`;
        }

        function renderTeacherLoginView() {
            const teachers = getTeachers();
            return `
            <div class="min-h-screen bg-slate-900 flex flex-col justify-center items-center p-6">
                <div class="max-w-md w-full bg-slate-800 border border-slate-700/80 rounded-3xl p-8 shadow-2xl space-y-6 fade-in">
                    <div class="flex items-center justify-between">
                        <button onclick="appState.view='landing'; render();" class="text-slate-400 hover:text-white text-xs flex items-center space-x-1.5 transition">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Kembali</span>
                        </button>
                        <span class="text-xs uppercase tracking-wider font-semibold text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full">Portal Guru</span>
                    </div>

                    <div class="text-center space-y-2">
                        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl mx-auto flex items-center justify-center text-2xl border border-indigo-500/30">
                            <i class="fa-solid fa-user-check"></i>
                        </div>
                        <h2 class="text-xl font-bold text-white">Login Guru</h2>
                        <p class="text-xs text-slate-400">Pilih nama Anda dan masukkan PIN untuk melakukan absensi.</p>
                    </div>

                    <form id="teacherLoginForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nama Guru / Mata Pelajaran</label>
                            <select id="loginTeacherId" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="">-- Pilih Guru --</option>
                                ${teachers.map(t => `<option value="${t.id}">${t.name} (${t.subject})</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">PIN Keamanan</label>
                            <input type="password" id="loginPin" placeholder="Masukkan 4 digit PIN (cth: 1234)" maxlength="4" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 tracking-widest text-center">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-200 text-sm">
                            Masuk & Absen
                        </button>
                    </form>
                </div>
            </div>`;
        }

        function renderTeacherDashboardView() {
            const t = appState.currentTeacher;
            const today = new Date().toISOString().split('T')[0];
            const todayRecord = attendanceCache.find(a => String(a.teacherId) === String(t.id) && String(a.date).startsWith(today));

            return `
            <div class="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
                <header class="bg-slate-800/80 border-b border-slate-700 px-6 py-4 flex justify-between items-center backdrop-blur">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow">
                            ${t.name.charAt(0)}
                        </div>
                        <div>
                            <h2 class="text-sm font-bold text-white">${t.name}</h2>
                            <p class="text-xs text-slate-400">${t.subject} &bull; NIP: ${t.nip}</p>
                        </div>
                    </div>
                    <button onclick="appState.view='teacher_login'; appState.currentTeacher=null; render();" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3.5 py-2 rounded-xl transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Keluar</span>
                    </button>
                </header>

                <main class="max-w-2xl mx-auto w-full p-6 flex-1 space-y-6 fade-in">
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
                            <div>
                                <span class="text-xs text-indigo-400 uppercase tracking-wider font-semibold">Status Hari Ini</span>
                                <h3 class="text-lg font-bold text-white mt-0.5">${new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</h3>
                            </div>
                            <div>
                                ${todayRecord ? 
                                    `<span class="px-3.5 py-1.5 rounded-full text-xs font-semibold ${todayRecord.status === 'Hadir' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : todayRecord.status === 'Sakit' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : todayRecord.status === 'Izin' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' : 'bg-purple-500/20 text-purple-300 border border-purple-500/30'}">${todayRecord.status}</span>` :
                                    `<span class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30">Belum Absen</span>`
                                }
                            </div>
                        </div>

                        ${todayRecord ? `
                            <div class="bg-slate-900/60 rounded-xl p-4 text-xs space-y-2 border border-slate-700/50">
                                <div class="flex justify-between"><span class="text-slate-400">Metode:</span><span class="font-medium text-white">${todayRecord.method}</span></div>
                                <div class="flex justify-between"><span class="text-slate-400">Jam Catat:</span><span class="font-medium text-white">${todayRecord.time}</span></div>
                                <div class="flex justify-between"><span class="text-slate-400">Keterangan:</span><span class="font-medium text-white">${todayRecord.notes || '-'}</span></div>
                                ${todayRecord.photo && todayRecord.photo !== 'null' ? `<div class="pt-2"><p class="text-slate-400 mb-1">Foto Verifikasi Wajah:</p><img src="${todayRecord.photo}" class="w-24 h-24 object-cover rounded-xl border border-slate-700"></div>` : ''}
                            </div>
                        ` : `
                            <div class="space-y-6 pt-2">
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="openAttendanceModal('Face ID')" class="bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white p-4 rounded-2xl shadow-lg transition flex flex-col items-center justify-center space-y-2 border border-indigo-500/30">
                                        <i class="fa-solid fa-face-smile text-2xl text-indigo-200"></i>
                                        <span class="text-xs font-bold">Absen Face ID</span>
                                    </button>
                                    <button onclick="openAttendanceModal('Barcode')" class="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 text-white p-4 rounded-2xl shadow-lg transition flex flex-col items-center justify-center space-y-2 border border-purple-500/30">
                                        <i class="fa-solid fa-qrcode text-2xl text-purple-200"></i>
                                        <span class="text-xs font-bold">Absen Barcode</span>
                                    </button>
                                </div>

                                <div class="border-t border-slate-700 pt-4 space-y-3">
                                    <h4 class="text-xs font-semibold uppercase text-slate-400">Atau Pilih Status Kehadiran (Sakit / Izin / Cuti)</h4>
                                    <form id="statusForm" onsubmit="submitStatusForm(event)" class="space-y-3">
                                        <div class="grid grid-cols-3 gap-2">
                                            <label class="cursor-pointer bg-slate-900 border border-slate-700 hover:border-indigo-500 p-2.5 rounded-xl text-center text-xs font-semibold flex items-center justify-center space-x-1 transition">
                                                <input type="radio" name="statusOption" value="Sakit" required class="text-indigo-600 focus:ring-indigo-500">
                                                <span>Sakit</span>
                                            </label>
                                            <label class="cursor-pointer bg-slate-900 border border-slate-700 hover:border-indigo-500 p-2.5 rounded-xl text-center text-xs font-semibold flex items-center justify-center space-x-1 transition">
                                                <input type="radio" name="statusOption" value="Izin" required class="text-indigo-600 focus:ring-indigo-500">
                                                <span>Izin</span>
                                            </label>
                                            <label class="cursor-pointer bg-slate-900 border border-slate-700 hover:border-indigo-500 p-2.5 rounded-xl text-center text-xs font-semibold flex items-center justify-center space-x-1 transition">
                                                <input type="radio" name="statusOption" value="Cuti" required class="text-indigo-600 focus:ring-indigo-500">
                                                <span>Cuti</span>
                                            </label>
                                        </div>
                                        <div>
                                            <input type="text" id="statusNotes" placeholder="Masukkan keterangan (misal: Surat dokter terlampir)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                        </div>
                                        <button type="submit" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-xl text-xs transition">
                                            Kirim Keterangan Ketidakhadiran
                                        </button>
                                    </form>
                                </div>
                            </div>
                        `}
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                        <h4 class="font-bold text-sm text-white flex items-center space-x-2">
                            <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i>
                            <span>Riwayat Absensi Anda</span>
                        </h4>
                        <div class="space-y-2">
                            ${attendanceCache.filter(a => String(a.teacherId) === String(t.id)).length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">Belum ada riwayat absensi.</p>' :
                                attendanceCache.filter(a => String(a.teacherId) === String(t.id)).slice(0, 5).map(a => `
                                    <div class="bg-slate-900/60 border border-slate-700/50 rounded-xl p-3 flex justify-between items-center text-xs">
                                        <div>
                                            <p class="font-semibold text-white">${a.date}</p>
                                            <p class="text-[10px] text-slate-400">${a.method} &bull; ${a.notes || '-'}</p>
                                        </div>
                                        <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold ${a.status === 'Hadir' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">${a.status}</span>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                </main>
            </div>`;
        }

        function renderAdminLoginView() {
            return `
            <div class="min-h-screen bg-slate-900 flex flex-col justify-center items-center p-6">
                <div class="max-w-md w-full bg-slate-800 border border-slate-700/80 rounded-3xl p-8 shadow-2xl space-y-6 fade-in">
                    <div class="flex items-center justify-between">
                        <button onclick="appState.view='landing'; render();" class="text-slate-400 hover:text-white text-xs flex items-center space-x-1.5 transition">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Kembali</span>
                        </button>
                        <span class="text-xs uppercase tracking-wider font-semibold text-purple-400 bg-purple-500/10 px-3 py-1 rounded-full">Administrator</span>
                    </div>

                    <div class="text-center space-y-2">
                        <div class="w-16 h-16 bg-purple-600/20 text-purple-400 rounded-2xl mx-auto flex items-center justify-center text-2xl border border-purple-500/30">
                            <i class="fa-solid fa-user-shield"></i>
                        </div>
                        <h2 class="text-xl font-bold text-white">Login Admin</h2>
                        <p class="text-xs text-slate-400">Masukkan kredensial admin untuk mengakses panel manajemen.</p>
                    </div>

                    <form id="adminLoginForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Username Admin</label>
                            <input type="text" id="adminUser" placeholder="Masukkan username (cth: admin)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password</label>

            return `

                                <span>Export Excel</span>

                                <i class="fa-solid fa-file-pdf"></i>
                                <span>Export PDF</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 overflow-x-auto">
                    <table class="w-full border-collapse text-xs" id="attendanceTableExport">

                            <tr class="bg-slate-50">
                                <th class="py-3 px-4 text-left font-semibold text-slate-700 border border-slate-200 sticky left-0 bg-slate-50 z-10">Nama Guru</th>

                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${teachers.length === 0 ? `<tr><td colspan="${daysInMonth + 1}" class="py-4 text-center text-slate-400">Belum ada data guru.</td></tr>` :
                                teachers.map(t => {
                                    let cells = '';
                                    for (let d = 1; d <= daysInMonth; d++) {
                                        const dayStr = String(d).padStart(2, '0');
                                        const dateStr = `${selectedMonth}-${dayStr}`;
                                        const att = attendance.find(a => String(a.teacherId) === String(t.id) && String(a.date) === dateStr);
                                        let badge = '<span class="text-slate-300">-</span>';
                                        if (att) {
                                            if (att.status === 'Hadir') {
                                                badge = '<span class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 inline-flex items-center justify-center font-bold text-[10px]" title="Hadir">H</span>';
                                            } else if (att.status === 'Sakit') {
                                                badge = '<span class="w-5 h-5 rounded-full bg-amber-100 text-amber-700 inline-flex items-center justify-center font-bold text-[10px]" title="Sakit">S</span>';

                                    }
                                    return `

                                            <td class="py-3 px-4 font-medium text-slate-700 border border-slate-200 sticky left-0 bg-white z-10 whitespace-nowrap">${t.name}</td>

                                        </tr>
                                    `;
                                }).join('')
                            }
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Sekolah</label>
                            <input type="text" id="settingSchoolName" value="${settings.schoolName}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tahun Ajaran</label>
                            <input type="text" id="settingAcademicYear" value="${settings.academicYear}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Batas Jam Masuk Tepat Waktu</label>
                            <input type="time" id="settingMaxTime" value="${settings.maxCheckInTime}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl shadow transition">
                            Simpan Perubahan
                        </button>
                    </form>
                </div>
            </div>`;
        }

        // Modal for Face ID & Barcode
        window.openAttendanceModal = function(type) {
            const modalHTML = `
            <div id="attendanceModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-md w-full space-y-6 text-center relative shadow-2xl fade-in">
                    <button onclick="closeAttendanceModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                    
                    <div class="space-y-1">
                        <h3 class="text-lg font-bold text-white">Pemindaian ${type}</h3>
                        <p class="text-xs text-slate-400">Arahkan kamera ke wajah atau pindai barcode Anda.</p>
                    </div>

                    <div class="relative w-full h-64 bg-black rounded-2xl overflow-hidden border border-slate-700 flex items-center justify-center">
                        <video id="webcamVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                        <canvas id="snapshotCanvas" class="hidden"></canvas>
                        <div class="absolute inset-0 border-2 border-dashed border-indigo-500/50 rounded-2xl pointer-events-none flex items-center justify-center">
                            <span class="bg-indigo-600/80 text-white text-[10px] px-3 py-1 rounded-full uppercase tracking-wider font-semibold animate-pulse">Scanning...</span>
                        </div>
                    </div>

                    <button onclick="executeVerification('${type}')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow transition text-sm">
                        Ambil Absen Sekarang
                    </button>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHTML);

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(stream => {
                    const video = document.getElementById('webcamVideo');
                    if (video) video.srcObject = stream;
                })
                .catch(err => {
                    console.error("Webcam error:", err);
                    showNotification('Kamera Gagal', 'Tidak dapat mengakses kamera perangkat.', 'error');
                });
        };

        window.closeAttendanceModal = function() {
            const video = document.getElementById('webcamVideo');
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            const modal = document.getElementById('attendanceModal');
            if (modal) modal.remove();
        };

        window.executeVerification = async function(method) {
            const video = document.getElementById('webcamVideo');
            const canvas = document.getElementById('snapshotCanvas');
            let photoData = null;

            if (video && canvas) {
                canvas.width = video.videoWidth || 320;
                canvas.height = video.videoHeight || 240;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                photoData = canvas.toDataURL('image/png');
            }

            closeAttendanceModal();

            const t = appState.currentTeacher;
            const today = new Date().toISOString().split('T')[0];
            const nowTime = new Date().toTimeString().split(' ')[0];

            const newRecord = {
                id: 'att-' + Date.now(),
                teacherId: t.id,
                teacherName: t.name,
                date: today,
                time: nowTime,
                method: method,
                status: 'Hadir',
                notes: `Berhasil verifikasi via ${method}`,
                photo: photoData
            };

            await saveAttendanceToCloud(newRecord);

            showNotification('Absensi Berhasil', `Kehadiran ${t.name} via ${method} berhasil disimpan ke Cloud.`, 'success', () => {
                render();
            });
        };

        window.submitStatusForm = async function(e) {
            e.preventDefault();
            const statusOption = document.querySelector('input[name="statusOption"]:checked').value;
            const notes = document.getElementById('statusNotes').value;

            const t = appState.currentTeacher;
            const today = new Date().toISOString().split('T')[0];
            const nowTime = new Date().toTimeString().split(' ')[0];

            const newRecord = {
                id: 'att-' + Date.now(),
                teacherId: t.id,
                teacherName: t.name,
                date: today,
                time: nowTime,
                method: 'Manual/Keterangan',
                status: statusOption,
                notes: notes,
                photo: ''
            };

            await saveAttendanceToCloud(newRecord);

            showNotification('Berhasil', `Keterangan ${statusOption} berhasil dikirim ke Cloud.`, 'success', () => {
                render();
            });
        };

        window.sendReminderWhatsApp = function(name, phone) {
            showNotification('Pengingat Terkirim', `Pesan WhatsApp pengingat absensi berhasil dikirim ke ${name}.`, 'success');
        };

        window.exportToExcel = function() {
            const table = document.getElementById('attendanceTableExport');
            if (!table) return;
            let html = table.outerHTML;
            let blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `Rekap_Absensi_${appState.selectedMonth}.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showNotification('Berhasil', 'File Excel rekap absensi berhasil diunduh.', 'success');
        };

        window.exportToPDF = function() {
            const settings = getSettings();
            const teachers = getTeachers();
            const selectedMonth = appState.selectedMonth || new Date().toISOString().slice(0, 7);
            const [year, month] = selectedMonth.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            let daysHeader = '';
            for (let d = 1; d <= daysInMonth; d++) {
                daysHeader += `<th style="border: 1px solid #cbd5e1; padding: 4px; text-align: center; font-size: 10px;">${d}</th>`;
            }

            let rowsHTML = '';
            teachers.forEach(t => {
                let cells = '';
                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${selectedMonth}-${dayStr}`;
                    const att = attendanceCache.find(a => String(a.teacherId) === String(t.id) && String(a.date) === dateStr);
                    let badge = '-';
                    if (att) {
                        if (att.status === 'Hadir') badge = 'H';
                        else if (att.status === 'Sakit') badge = 'S';
                        else if (att.status === 'Izin') badge = 'I';
                        else if (att.status === 'Cuti') badge = 'C';
                    }
                    cells += `<td style="border: 1px solid #cbd5e1; padding: 4px; text-align: center; font-size: 10px; font-weight: bold;">${badge}</td>`;
                }
                rowsHTML += `
                    <tr>
                        <td style="border: 1px solid #cbd5e1; padding: 6px 8px; font-size: 11px; white-space: nowrap;">${t.name}</td>
                        ${cells}
                    </tr>
                `;
            });

            const printWindow = window.open('', '_blank');
            if (!printWindow) {
                showNotification('Gagal', 'Pop-up diblokir oleh browser.', 'error');
                return;
            }

            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Rekap Absensi Guru - ${selectedMonth}</title>
                    <style>
                        body { font-family: 'Inter', Arial, sans-serif; color: #1e293b; margin: 20px; }
                        h2 { margin-bottom: 4px; color: #0f172a; }
                        p { margin-top: 0; color: #64748b; font-size: 12px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th { background-color: #f1f5f9; color: #334155; font-size: 11px; }
                    </style>
                </head>
                <body>
                    <h2>REKAP ABSENSI GURU - ${settings.schoolName}</h2>
                    <p>Periode Bulan: ${selectedMonth} | Tahun Ajaran: ${settings.academicYear}</p>
                    <table>
                        <thead>
                            <tr>
                                <th style="border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left;">Nama Guru</th>
                                ${daysHeader}
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHTML}
                        </tbody>
                    </table>
                    <script>
                        window.onload = function() {
                            setTimeout(() => {
                                window.print();
                                window.close();
                            }, 500);
                        }
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
            showNotification('Berhasil', 'Dokumen PDF disiapkan.', 'success');
        };

        window.deleteTeacher = function(id) {
            let teachers = getTeachers();
            teachers = teachers.filter(t => t.id !== id);
            saveTeachers(teachers);
            showNotification('Berhasil', 'Data guru berhasil dihapus.', 'success', () => { render(); });
        };

        function openAddTeacherModal() {
            const modalHTML = `
            <div id="teacherModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-6 shadow-2xl fade-in">
                    <h3 class="font-bold text-slate-800 text-base">Tambah Data Guru Baru</h3>
                    <form id="teacherForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Lengkap & Gelar</label>
                            <input type="text" id="newTeacherName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">NIP</label>
                            <input type="text" id="newTeacherNip" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mata Pelajaran</label>
                            <input type="text" id="newTeacherSubject" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">PIN Keamanan (4 Digit)</label>
                            <input type="password" id="newTeacherPin" maxlength="4" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="flex space-x-3 pt-2">
                            <button type="button" onclick="document.getElementById('teacherModal').remove()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-xl text-xs font-semibold transition">Batal</button>
                            <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-xs font-semibold transition">Simpan</button>
                        </div>
                    </form>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHTML);

            document.getElementById('teacherForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('newTeacherName').value;
                const nip = document.getElementById('newTeacherNip').value;
                const subject = document.getElementById('newTeacherSubject').value;
                const pin = document.getElementById('newTeacherPin').value;

                let teachers = getTeachers();
                const newT = {
                    id: 'T' + String(teachers.length + 1).padStart(3, '0'),
                    name, nip, subject, pin,
                    barcode: 'BC-T' + String(teachers.length + 1).padStart(3, '0')
                };
                teachers.push(newT);
                saveTeachers(teachers);

                document.getElementById('teacherModal').remove();
                showNotification('Berhasil', 'Data guru baru berhasil ditambahkan.', 'success', () => { render(); });
            });
        }

        function attachEventHandlers() {
            const teacherLoginForm = document.getElementById('teacherLoginForm');
            if (teacherLoginForm) {
                teacherLoginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const id = document.getElementById('loginTeacherId').value;
                    const pin = document.getElementById('loginPin').value;
                    const teachers = getTeachers();
                    const teacher = teachers.find(t => t.id === id);

                    if (teacher && teacher.pin === pin) {
                        appState.currentTeacher = teacher;
                        appState.view = 'teacher_dashboard';
                        render();
                    } else {
                        showNotification('Login Gagal', 'Guru atau PIN Keamanan tidak valid.', 'error');
                    }
                });
            }

            const adminLoginForm = document.getElementById('adminLoginForm');
            if (adminLoginForm) {
                adminLoginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const user = document.getElementById('adminUser').value;
                    const pass = document.getElementById('adminPass').value;

                    if (user === 'admin' && pass === 'admin123') {
                        appState.view = 'admin_dashboard';
                        render();
                    } else {
                        showNotification('Login Gagal', 'Username atau password admin salah.', 'error');
                    }
                });
            }

            document.querySelectorAll('.admin-tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    appState.adminActiveTab = btn.getAttribute('data-tab');
                    render();
                });
            });

            const calendarMonthInput = document.getElementById('calendarMonthInput');
            if (calendarMonthInput) {
                calendarMonthInput.addEventListener('change', (e) => {
                    appState.selectedMonth = e.target.value;
                    render();
                });
            }

            const adminManualForm = document.getElementById('adminManualForm');
            if (adminManualForm) {
                adminManualForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const teacherId = document.getElementById('manualTeacherId').value;
                    const date = document.getElementById('manualDate').value;
                    const status = document.getElementById('manualStatus').value;
                    const notes = document.getElementById('manualNotes').value || 'Input manual Admin';

                    const teachers = getTeachers();
                    const teacher = teachers.find(t => t.id === teacherId);
                    if (!teacher) return;

                    const record = {
                        id: 'att-' + Date.now(),
                        teacherId: teacher.id,
                        teacherName: teacher.name,
                        date: date,
                        time: new Date().toTimeString().split(' ')[0],
                        method: 'Manual Admin',
                        status: status,
                        notes: notes,
                        photo: ''
                    };

                    await saveAttendanceToCloud(record);
                    showNotification('Berhasil', `Absensi manual untuk ${teacher.name} berhasil disimpan ke Cloud.`, 'success', () => {
                        appState.adminActiveTab = 'attendance';
                        render();
                    });
                });
            }

            const addTeacherBtn = document.getElementById('addTeacherBtn');
            if (addTeacherBtn) {
                addTeacherBtn.addEventListener('click', () => {
                    openAddTeacherModal();
                });
            }

            const settingsForm = document.getElementById('settingsForm');
            if (settingsForm) {
                settingsForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const schoolName = document.getElementById('settingSchoolName').value;
                    const academicYear = document.getElementById('settingAcademicYear').value;
                    const maxCheckInTime = document.getElementById('settingMaxTime').value;

                    saveSettings({ schoolName, academicYear, maxCheckInTime });
                    showNotification('Berhasil', 'Pengaturan aplikasi berhasil diperbarui.', 'success');
                });
            }
        }

        // Initialize App on Load
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
